[project]
name = "chefdemo-backend"
version = "0.1.0"
description = "FastAPI and SQLModel backend starter"
requires-python = ">=3.12"

[tool.taskipy.tasks]
run = "uvicorn app.main:app --reload"
migrate = "alembic upgrade head"
makemigrations = "alembic revision --autogenerate -m update"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
